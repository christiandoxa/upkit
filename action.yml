name: Setup upkit
description: Install a verified standalone upkit binary from GitHub Releases.
branding:
  color: blue
  icon: package

inputs:
  version:
    description: Release version to install, or latest.
    required: false
    default: latest

outputs:
  version:
    description: Installed upkit CLI version.
    value: ${{ steps.unix.outputs.version || steps.windows.outputs.version }}
  bin_dir:
    description: Directory added to PATH for the upkit binary.
    value: ${{ steps.unix.outputs.bin_dir || steps.windows.outputs.bin_dir }}

runs:
  using: composite
  steps:
    - name: Install upkit on Linux or macOS
      id: unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        UPKIT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        bin_dir="$RUNNER_TEMP/upkit/bin"
        sh "$GITHUB_ACTION_PATH/install.sh" --release "$UPKIT_VERSION" --install-dir "$bin_dir"
        printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
        version="$("$bin_dir/upkit" --version)"
        printf 'version=%s\n' "${version#upkit }" >> "$GITHUB_OUTPUT"
        printf 'bin_dir=%s\n' "$bin_dir" >> "$GITHUB_OUTPUT"
    - name: Install upkit on Windows
      id: windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        UPKIT_VERSION: ${{ inputs.version }}
        UPKIT_NO_PATH_UPDATE: "1"
      run: |
        $binDir = Join-Path $env:RUNNER_TEMP 'upkit/bin'
        & "$env:GITHUB_ACTION_PATH/install.ps1" -Release $env:UPKIT_VERSION -InstallDir $binDir
        $binDir >> $env:GITHUB_PATH
        $version = (& (Join-Path $binDir 'upkit.exe') --version) -replace '^upkit ', ''
        "version=$version" >> $env:GITHUB_OUTPUT
        "bin_dir=$binDir" >> $env:GITHUB_OUTPUT
