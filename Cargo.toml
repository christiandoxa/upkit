[package]
name = "upkit"
version = "0.5.0-rc.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Standalone developer environment manager for toolchains, artifacts, and maintenance."
readme = "README.md"
repository = "https://github.com/christiandoxa/upkit"
keywords = ["cli", "updater", "toolchain", "devtools"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
# Reports need UTC formatting on every platform; Linux-only clock use stays below.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
dialoguer = "0.12.0"
dirs = "7.0.0"
hex = "0.4.3"
indicatif = "0.18.6"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
flate2 = "1.1.10"
xz2 = { version = "0.1.7", features = ["static"] }
zstd = "0.14.3"
tempfile = "3.27.0"
toml = "1.1.8"
which = "8.0.6"
# Paragraph::line_count is unstable; pin Ratatui until the API stabilizes.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "unstable-rendered-line-info"] }
crossterm = "0.29"
globset = "0.4.21"
quick-xml = { version = "0.42", default-features = false }
# ZipIterable is unstable; keep this version exact when updating its API.
zip = { version = "=9.2.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
siphasher = "1.0.4"

[target.'cfg(target_os = "windows")'.dependencies]
known-folders = "1.4.2"
winapi-util = "=0.1.11"
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"] }
