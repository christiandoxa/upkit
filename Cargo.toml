[package]
name = "upkit"
version = "0.4.15"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "One CLI to check & update Go/Rust/Node/Python/Flutter/Mojo (hybrid built-in + direct-download)."
readme = "README.md"
repository = "https://github.com/christiandoxa/upkit"
keywords = ["cli", "updater", "toolchain", "devtools"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
dialoguer = "0.12.0"
dirs = "7.0.0"
hex = "0.4.3"
indicatif = "0.18.6"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
flate2 = "1.1.10"
xz2 = { version = "0.1.7", features = ["static"] }
zstd = "0.14.3"
tempfile = "3.27.0"
toml = "1.1.8"
which = "8.0.6"

[dev-dependencies]
jmpln = "0.1.0"
