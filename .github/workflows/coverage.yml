name: Coverage

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --lcov --output-path coverage.out
          cargo llvm-cov report -q | awk '/^Filename/ { next } /^TOTAL/ { printf "total: (lines) %.2f%%\n", $10; next } NF > 0 { printf "✓ %s (lines: %.2f%%)\n", $1, $10 }'
          total=$(cargo llvm-cov report -q | awk '/^TOTAL/ { print $10 }')
          total=${total%%%}
          awk -v t="$total" 'BEGIN { exit (t + 0 < 90) }'

      - name: Upload measured coverage for audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upkit-coverage-lcov
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 7
