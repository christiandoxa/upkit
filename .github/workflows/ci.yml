name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --check

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check build graph
        run: cargo check --locked

      - name: Run test suite
        run: cargo test --locked -- --test-threads=1

  action-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build upkit binary
        run: cargo build --locked

      - name: Test installers
        run: python tests/test_installers.py

      - name: Stage local release fixture
        shell: python
        run: |
          import hashlib, os, pathlib, platform, tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          arch = "aarch64" if platform.machine().lower() in ("arm64", "aarch64") else "x86_64"
          system = {"Linux": "unknown-linux-gnu", "Darwin": "apple-darwin", "Windows": "pc-windows-msvc"}[platform.system()]
          extension = ".exe" if os.name == "nt" else ""
          asset = f"upkit-{arch}-{system}{extension}"
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "upkit-release-fixture"
          root.mkdir()
          data = pathlib.Path(f"target/debug/upkit{extension}").read_bytes()
          (root / asset).write_bytes(data)
          (root / "SHA256SUMS").write_text(f"{hashlib.sha256(data).hexdigest()}  {asset}\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"UPKIT_RELEASE_BASE_URL={root}\nUPKIT_FIXTURE_VERSION={version}\n")

      - name: Install via local action
        id: setup-upkit
        uses: ./
        with:
          version: ${{ env.UPKIT_FIXTURE_VERSION }}

      - name: Verify installed CLI
        shell: bash
        env:
          ACTUAL_VERSION: ${{ steps.setup-upkit.outputs.version }}
        run: |
          upkit --version
          test "$ACTUAL_VERSION" = "$UPKIT_FIXTURE_VERSION"
